{{ define "main" }}
<div class="min-h-screen pb-20">
    <!-- Header -->
    <header class="bg-white border-b px-4 py-3 sticky top-0 z-10">
        <h1 class="text-lg font-bold text-center">{{ .Title }}</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- Section A: Basic Information -->
        <section class="bg-white rounded-lg shadow-sm border p-4">
            <h2 class="font-bold mb-4 text-gray-800">기본 정보</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">이름</label>
                    <input type="text" id="name" readonly
                        class="w-full px-3 py-2 border rounded-lg bg-gray-50 text-gray-600 cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">닉네임</label>
                    <input type="text" id="nickname"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="닉네임을 입력하세요">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">이메일</label>
                    <input type="email" id="email" readonly
                        class="w-full px-3 py-2 border rounded-lg bg-gray-50 text-gray-600 cursor-not-allowed">
                </div>
            </div>
        </section>

        <!-- Section B: Contact Information -->
        <section class="bg-white rounded-lg shadow-sm border p-4">
            <h2 class="font-bold mb-4 text-gray-800">연락처 정보</h2>
            <form id="profile-form" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">휴대전화</label>
                    <input type="tel" id="phone" name="phone"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="010-0000-0000">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">주소</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="postcode" name="postcode" placeholder="우편번호" readonly
                            class="w-24 px-3 py-2 border rounded-lg bg-gray-50 text-gray-600">
                        <button type="button" onclick="openPostcode()"
                            class="flex-1 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-700 transition-colors">주소
                            검색</button>
                    </div>
                    <input type="text" id="address" name="address" placeholder="기본 주소" readonly
                        class="w-full px-3 py-2 border rounded-lg bg-gray-50 text-gray-600 mb-2">
                    <input type="text" id="detailAddress" name="detailAddress" placeholder="상세 주소를 입력하세요"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                    <input type="hidden" id="extraAddress" name="extraAddress">
                    <span id="guide" class="text-xs text-gray-500 mt-1" style="display:none;"></span>
                </div>
            </form>
        </section>

        <!-- Section C: Password Change -->
        <section class="bg-white rounded-lg shadow-sm border p-4">
            <h2 class="font-bold mb-4 text-gray-800">비밀번호 변경</h2>
            <form id="password-form" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">현재 비밀번호</label>
                    <input type="password" id="oldPassword" name="oldPassword"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="현재 비밀번호를 입력하세요">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">새 비밀번호</label>
                    <input type="password" id="newPassword" name="newPassword"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="새 비밀번호를 입력하세요">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">새 비밀번호 확인</label>
                    <input type="password" id="newPasswordConfirm" name="newPasswordConfirm"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="새 비밀번호를 다시 입력하세요">
                </div>
                <div class="pt-2">
                    <button type="button" id="change-password-btn"
                        class="w-full bg-gray-800 text-white py-2.5 rounded-lg font-medium hover:bg-gray-700 active:bg-gray-900 transition-colors">
                        비밀번호 변경
                    </button>
                </div>
            </form>
        </section>

        <!-- Section D: Order History -->
        <section class="bg-white rounded-lg shadow-sm border p-4">
            <h2 class="font-bold mb-4 text-gray-800">주문 내역</h2>
            <div id="order-history-list" class="space-y-4">
                <div class="text-center py-6 text-gray-500 text-sm">
                    불러오는 중...
                </div>
            </div>
        </section>
    </main>

    <!-- Section D: Footer Button -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t safe-area-bottom">
        <div class="max-w-md mx-auto">
            <button id="save-button"
                class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-lg hover:bg-blue-700 active:bg-blue-800 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
                저장하기
            </button>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast"
    class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    메시지
</div>

<!-- Daum Postcode Layer (Modal) -->
<div id="daum-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white w-full max-w-md h-[500px] relative rounded-lg overflow-hidden shadow-xl mx-4">
        <button type="button" onclick="closePostcode()"
            class="absolute top-0 right-0 m-2 text-gray-500 hover:text-gray-800 z-10 p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div id="daum-postcode-container" class="w-full h-full"></div>
    </div>
</div>

<!-- Tracking Modal (배송조회) -->
<div id="tracking-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden">
    <div class="bg-white w-full max-w-md relative rounded-lg overflow-hidden shadow-xl mx-4">
        <div class="p-4 border-b flex justify-between items-center">
            <h3 class="text-lg font-bold text-gray-800">배송조회</h3>
            <button type="button" onclick="Profile.closeTrackingModal()" class="text-gray-500 hover:text-gray-800 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>
        <div class="p-4 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">택배사 선택</label>
                <select id="tracking-carrier"
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    <option value="">택배사를 선택하세요</option>
                    <option value="cj">CJ대한통운</option>
                    <option value="lotte">롯데택배</option>
                    <option value="hanjin">한진택배</option>
                    <option value="post">우체국택배</option>
                    <option value="logen">로젠택배</option>
                    <option value="cu">CU편의점택배</option>
                    <option value="gs">GS Postbox 택배</option>
                    <option value="kdexp">경동택배</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">운송장 번호</label>
                <input type="text" id="tracking-number" placeholder="운송장 번호를 입력하세요"
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            </div>
            <button type="button" onclick="Profile.trackDelivery()"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                조회하기
            </button>
            <p class="text-xs text-gray-500 text-center">
                택배사 홈페이지로 이동하여 배송 상태를 확인합니다.
            </p>
        </div>
    </div>
</div>

<script>
    const layer = document.getElementById('daum-layer');
    const container = document.getElementById('daum-postcode-container');

    function closePostcode() {
        layer.classList.add('hidden');
    }

    function openPostcode() {
        new daum.Postcode({
            oncomplete: function (data) {
                var roadAddr = data.roadAddress;
                var extraRoadAddr = '';

                if (data.bname !== '' && /[동|로|가]$/g.test(data.bname)) {
                    extraRoadAddr += data.bname;
                }
                if (data.buildingName !== '' && data.apartment === 'Y') {
                    extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                }
                if (extraRoadAddr !== '') {
                    extraRoadAddr = ' (' + extraRoadAddr + ')';
                }

                document.getElementById('postcode').value = data.zonecode;

                if (data.userSelectedType === 'R') {
                    document.getElementById("address").value = roadAddr;
                } else {
                    document.getElementById("address").value = data.jibunAddress;
                }

                if (roadAddr !== '') {
                    document.getElementById("extraAddress").value = extraRoadAddr;
                } else {
                    document.getElementById("extraAddress").value = '';
                }

                var guideTextBox = document.getElementById("guide");
                if (data.autoRoadAddress) {
                    var expRoadAddr = data.autoRoadAddress + extraRoadAddr;
                    guideTextBox.innerHTML = '(예상 도로명 주소 : ' + expRoadAddr + ')';
                    guideTextBox.style.display = 'block';
                } else if (data.autoJibunAddress) {
                    var expJibunAddr = data.autoJibunAddress;
                    guideTextBox.innerHTML = '(예상 지번 주소 : ' + expJibunAddr + ')';
                    guideTextBox.style.display = 'block';
                } else {
                    guideTextBox.innerHTML = '';
                    guideTextBox.style.display = 'none';
                }

                document.getElementById("detailAddress").focus();
                closePostcode();
            },
            width: '100%',
            height: '100%',
            maxSuggestItems: 5
        }).embed(container);

        layer.classList.remove('hidden');
    }
</script>

{{ $profileScript := resources.Get "js/profile.js" }}
<script src="{{ $profileScript.Permalink }}"></script>
{{ end }}
