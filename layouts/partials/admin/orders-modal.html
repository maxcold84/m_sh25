<!-- Order Detail Modal -->
<div class="modal fade" id="order-detail-modal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    주문 상세 정보
                    <span id="modal-order-status" class="badge badge-success ml-2">Paid</span>
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="닫기">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <!-- Buyer Info -->
                    <div class="col-12 mb-4">
                        <h6 class="font-weight-bold mb-3 border-bottom pb-2">주문자 / 배송 정보</h6>
                        <div class="bg-light p-3 rounded">
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <span class="font-weight-bold">이름:</span> <span id="modal-buyer-name">-</span>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <span class="font-weight-bold">전화번호:</span> <span id="modal-buyer-phone">-</span>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <span class="font-weight-bold">이메일:</span> <span id="modal-buyer-email">-</span>
                                </div>
                                <div class="col-12 mb-2">
                                    <span class="font-weight-bold">주소:</span> <span id="modal-buyer-address">-</span>
                                </div>
                                <div class="col-12 text-muted small">
                                    결제 ID: <span id="modal-payment-id">-</span>
                                </div>
                                <div class="col-12 text-muted small">
                                    주문 일시: <span id="modal-order-date">-</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Order Items -->
                    <div class="col-12 mb-4">
                        <h6 class="font-weight-bold mb-3 border-bottom pb-2">주문 상품</h6>
                        <div id="modal-order-items" class="border rounded" style="max-height: 300px; overflow-y: auto;">
                            <!-- Items injected here -->
                        </div>
                        <div class="text-right mt-3">
                            <span class="h5">총 결제금액: <span class="font-weight-bold text-primary"
                                    id="modal-total-amount">0원</span></span>
                        </div>
                    </div>

                    <!-- Tracking Info Form -->
                    <div class="col-12">
                        <h6 class="font-weight-bold mb-3 border-bottom pb-2">운송장 정보</h6>
                        <div class="form-row align-items-end">
                            <div class="form-group col-md-4">
                                <label for="tracking-carrier" class="small text-muted mb-1">택배사</label>
                                <select id="tracking-carrier" class="form-control form-control-sm">
                                    <option value="">선택하세요</option>
                                    <option value="cj">CJ대한통운</option>
                                    <option value="hanjin">한진택배</option>
                                    <option value="lotte">롯데택배</option>
                                    <option value="logen">로젠택배</option>
                                    <option value="post">우체국택배</option>
                                    <option value="epost">우체국EMS</option>
                                    <option value="kdexp">경동택배</option>
                                </select>
                            </div>
                            <div class="form-group col-md-5">
                                <label for="tracking-number" class="small text-muted mb-1">운송장번호</label>
                                <input type="text" id="tracking-number" class="form-control form-control-sm"
                                    placeholder="운송장번호 입력">
                            </div>
                            <div class="form-group col-md-3">
                                <button type="button" id="save-tracking-btn" class="btn btn-success btn-sm btn-block"
                                    onclick="AdminOrders.saveTrackingInfo()">
                                    저장
                                </button>
                            </div>
                        </div>
                        <p id="tracking-status-msg" class="small mt-1"></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="track-delivery-btn" class="btn btn-info d-none"
                    onclick="AdminOrders.openTrackingUrl()">
                    <i class="tf-ion-ios-location"></i> 배송조회
                </button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
