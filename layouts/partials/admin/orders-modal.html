<!-- Order Detail Modal -->
<div id="order-detail-modal" class="fixed inset-0 z-50 hidden" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="order-detail-modal-title" aria-hidden="true">
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-[2px]" data-modal-backdrop="order-detail-modal"></div>
    <div class="relative flex min-h-full items-end justify-center p-4 sm:items-center sm:p-6 lg:p-8">
        <div class="w-full max-w-5xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl shadow-slate-900/10">
            <div class="flex items-start justify-between gap-4 border-b border-slate-200 bg-slate-50 px-5 py-4 sm:px-6">
                <div>
                    <h5 id="order-detail-modal-title" class="text-lg font-semibold text-slate-900">
                        주문 상세 정보
                        <span id="modal-order-status" class="ml-2 inline-flex items-center rounded-full bg-emerald-100 px-2.5 py-1 text-[11px] font-semibold text-emerald-700 ring-1 ring-inset ring-emerald-200">Paid</span>
                    </h5>
                    <p class="mt-1 text-sm text-slate-500">주문자, 상품, 배송 정보를 한 곳에서 관리합니다.</p>
                </div>
                <button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-200 hover:text-slate-900" data-modal-close="order-detail-modal" aria-label="닫기">
                    <span aria-hidden="true" class="text-2xl leading-none">&times;</span>
                </button>
            </div>
            <div class="px-5 py-5 sm:px-6 lg:px-8">
                <div class="space-y-6">
                    <!-- Buyer Info -->
                    <section class="rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:p-5">
                        <h6 class="mb-4 border-b border-slate-200 pb-2 text-sm font-semibold text-slate-900">주문자 / 배송 정보</h6>
                        <div class="grid gap-4 sm:grid-cols-2">
                            <div>
                                <div class="text-xs font-medium uppercase tracking-wide text-slate-500">이름</div>
                                <div id="modal-buyer-name" class="mt-1 text-sm text-slate-900">-</div>
                            </div>
                            <div>
                                <div class="text-xs font-medium uppercase tracking-wide text-slate-500">전화번호</div>
                                <div id="modal-buyer-phone" class="mt-1 text-sm text-slate-900">-</div>
                            </div>
                            <div>
                                <div class="text-xs font-medium uppercase tracking-wide text-slate-500">이메일</div>
                                <div id="modal-buyer-email" class="mt-1 text-sm text-slate-900">-</div>
                            </div>
                            <div class="sm:col-span-2">
                                <div class="text-xs font-medium uppercase tracking-wide text-slate-500">주소</div>
                                <div id="modal-buyer-address" class="mt-1 text-sm text-slate-900">-</div>
                            </div>
                            <div class="sm:col-span-2">
                                <div class="text-xs font-medium uppercase tracking-wide text-slate-500">배송 메모</div>
                                <div id="modal-buyer-delivery-note" class="mt-1 text-sm text-slate-900">-</div>
                            </div>
                            <div class="sm:col-span-2">
                                <div class="text-xs font-medium uppercase tracking-wide text-slate-500">결제 ID</div>
                                <div id="modal-payment-id" class="mt-1 text-sm font-medium text-slate-900">-</div>
                            </div>
                            <div>
                                <div class="text-xs font-medium uppercase tracking-wide text-slate-500">주문 일시</div>
                                <div id="modal-order-date" class="mt-1 text-sm text-slate-900">-</div>
                            </div>
                        </div>
                    </section>

                    <!-- Order Items -->
                    <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
                        <div class="flex items-center justify-between gap-3 border-b border-slate-200 pb-2">
                            <h6 class="text-sm font-semibold text-slate-900">주문 상품</h6>
                            <span class="text-xs text-slate-500">최대 300px 스크롤</span>
                        </div>
                        <div id="modal-order-items" class="mt-4 max-h-[320px] overflow-y-auto rounded-2xl border border-slate-200 bg-slate-50/50">
                            <!-- Items injected here -->
                        </div>
                        <div class="mt-4 text-right">
                            <span class="text-lg font-semibold text-slate-900">총 결제금액: <span class="font-bold text-slate-900" id="modal-total-amount">0원</span></span>
                        </div>
                    </section>

                    <!-- Tracking Info Form -->
                    <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5">
                        <h6 class="mb-4 border-b border-slate-200 pb-2 text-sm font-semibold text-slate-900">운송장 정보</h6>
                        <div class="grid gap-4 md:grid-cols-12 md:items-end">
                            <div class="md:col-span-4">
                                <label for="tracking-carrier" class="mb-2 block text-xs font-medium uppercase tracking-wide text-slate-500">택배사</label>
                                <select id="tracking-carrier" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition focus:border-slate-400 focus:ring-4 focus:ring-slate-100">
                                    <option value="">선택하세요</option>
                                    <option value="cj">CJ대한통운</option>
                                    <option value="hanjin">한진택배</option>
                                    <option value="lotte">롯데택배</option>
                                    <option value="logen">로젠택배</option>
                                    <option value="post">우체국택배</option>
                                    <option value="epost">우체국EMS</option>
                                    <option value="kdexp">경동택배</option>
                                </select>
                            </div>
                            <div class="md:col-span-5">
                                <label for="tracking-number" class="mb-2 block text-xs font-medium uppercase tracking-wide text-slate-500">운송장번호</label>
                                <input type="text" id="tracking-number" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-slate-400 focus:ring-4 focus:ring-slate-100"
                                    placeholder="운송장번호 입력">
                            </div>
                            <div class="md:col-span-3">
                                <button type="button" id="save-tracking-btn" class="inline-flex w-full items-center justify-center rounded-full bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-400 focus:outline-none focus:ring-4 focus:ring-emerald-200">
                                    저장
                                </button>
                            </div>
                        </div>
                        <p id="tracking-status-msg" class="mt-2 text-sm text-slate-500"></p>
                    </section>
                </div>
            </div>
            <div class="flex flex-wrap items-center justify-end gap-3 border-t border-slate-200 bg-slate-50 px-5 py-4 sm:px-6">
                <button type="button" id="archive-order-btn" class="inline-flex items-center justify-center gap-2 rounded-full bg-amber-400 px-4 py-2.5 text-sm font-semibold text-slate-900 transition hover:bg-amber-300 focus:outline-none focus:ring-4 focus:ring-amber-200">
                    <i class="tf-ion-archive"></i> 보관
                </button>
                <button type="button" id="delete-order-btn" class="inline-flex items-center justify-center gap-2 rounded-full bg-rose-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-rose-400 focus:outline-none focus:ring-4 focus:ring-rose-200">
                    <i class="tf-ion-trash-a"></i> 삭제
                </button>
                <button type="button" id="track-delivery-btn" class="hidden inline-flex items-center justify-center gap-2 rounded-full bg-sky-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-400 focus:outline-none focus:ring-4 focus:ring-sky-200">
                    <i class="tf-ion-ios-location"></i> 배송조회
                </button>
                <button type="button" class="inline-flex items-center justify-center rounded-full border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50" data-modal-close="order-detail-modal">닫기</button>
            </div>
        </div>
    </div>
</div>
