<!-- Admin Orders Filters -->
<div class="alert alert-light border mb-4 p-3">
    <div style="display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: flex-end;">
        <div style="flex: 1 1 220px; min-width: 0;">
            <label for="status-filter" class="font-weight-bold mb-1 d-block">상태 필터</label>
            <select id="status-filter" class="form-control form-control-sm">
                <option value="">전체 (All)</option>
                <option value="paid">결제완료 (Paid)</option>
                <option value="shipping">배송중 (Shipping)</option>
                <option value="pending">결제대기 (Pending)</option>
                <option value="cancelled">취소됨 (Cancelled)</option>
                <option value="archived">보관됨 (Archived)</option>
            </select>
        </div>
        <div style="flex: 0 0 auto;">
            <button type="button" id="refresh-btn" class="btn btn-outline-secondary btn-sm" title="새로고침">
                <i class="tf-ion-refresh"></i> 새로고침
            </button>
        </div>
    </div>
</div>
