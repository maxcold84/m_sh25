<!-- Admin Orders Filters -->
<section class="admin-card admin-filter-panel">
    <div class="grid gap-4 md:grid-cols-[minmax(0,1fr)_auto] md:items-end">
        <div class="admin-field min-w-0">
            <label for="status-filter" class="admin-field__label">상태 필터</label>
            <select id="status-filter" class="admin-select">
                <option value="">전체 (All)</option>
                <option value="paid">결제완료 (Paid)</option>
                <option value="shipping">배송중 (Shipping)</option>
                <option value="pending">결제대기 (Pending)</option>
                <option value="cancelled">취소됨 (Cancelled)</option>
                <option value="archived">보관됨 (Archived)</option>
            </select>
        </div>
        <div class="admin-actions justify-start md:justify-end">
            <button type="button" id="refresh-btn"
                class="admin-btn admin-btn--outline admin-btn--sm"
                title="새로고침">
                <i class="tf-ion-refresh admin-btn__icon"></i> 새로고침
            </button>
        </div>
    </div>
</section>
