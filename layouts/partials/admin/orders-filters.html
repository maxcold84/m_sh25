<!-- Admin Orders Filters -->
<div class="bg-white p-4 rounded-lg shadow-sm border mb-6">
    <div class="flex flex-wrap gap-4 items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-700">상태 필터:</span>
            <select id="status-filter" class="border rounded px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500">
                <option value="">전체</option>
                <option value="paid">결제완료 (Paid)</option>
                <option value="shipping">배송중 (Shipping)</option>
                <option value="pending">결제대기 (Pending)</option>
                <option value="cancelled">취소됨 (Cancelled)</option>
            </select>
        </div>
        <button type="button" id="refresh-btn" class="p-2 text-gray-500 hover:text-blue-600" title="새로고침">
            <i class="tf-ion-refresh"></i> 새로고침
        </button>
    </div>
</div>
