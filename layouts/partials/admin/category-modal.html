<!-- Category Management Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">카테고리 관리</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="닫기">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Add Category Form -->
                <form id="category-form" class="mb-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="new-category-name" placeholder="새 카테고리 이름" required>
                        <div class="input-group-append">
                            <button class="btn btn-primary" type="submit">추가</button>
                        </div>
                    </div>
                </form>

                <!-- Category List -->
                <h6 class="font-weight-bold mb-3">등록된 카테고리</h6>
                <div id="category-list" class="list-group" style="max-height: 300px; overflow-y: auto;">
                    <!-- Categories will be injected here -->
                    <div class="text-center py-3 text-muted">로딩 중...</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
