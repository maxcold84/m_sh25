<section class="checkout-section checkout-section--shipping">
    <div class="checkout-section__header">
        <h2 class="checkout-section__title">배송지 정보</h2>
    </div>
    <div class="checkout-section__body">
        <form id="shipping-form" class="space-y-3">
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">받는 분</label>
                <input type="text" name="receiver" required
                    autocomplete="name"
                    class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                    placeholder="이름을 입력하세요">
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">휴대폰</label>
                <input type="tel" name="phone" required
                    inputmode="tel"
                    autocomplete="tel"
                    class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                    placeholder="010-0000-0000">
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">주소</label>
                <div class="mb-2 flex flex-col gap-2 sm:flex-row">
                    <input type="text" id="postcode" name="postcode" placeholder="우편번호" readonly
                        autocomplete="postal-code"
                        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-sm text-slate-600 sm:w-28">
                    <button type="button" data-checkout-action="open-postcode"
                        class="w-full rounded-xl bg-slate-900 px-4 py-3 text-sm font-medium text-white transition-colors hover:bg-slate-800 active:bg-slate-950 sm:flex-1">주소
                        검색</button>
                </div>
                <input type="text" id="address" name="address" placeholder="기본 주소" readonly
                    autocomplete="street-address"
                    class="mb-2 w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-sm text-slate-600">
                <input type="text" id="detailAddress" name="detailAddress" placeholder="상세 주소를 입력하세요"
                    autocomplete="address-line2"
                    class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500">
                <input type="hidden" id="extraAddress" name="extraAddress">
                <span id="guide" class="mt-1 text-xs text-gray-500" style="display:none;"></span>
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">배송 메모</label>
                <input type="text" name="deliveryNote"
                    class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
                    placeholder="예) 문 앞에 놓아주세요.">
            </div>

            <div class="flex flex-col justify-between gap-2 pt-2 sm:flex-row sm:items-center">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="save-address"
                        class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <label for="save-address" class="text-sm text-slate-600">다음에도 사용할게요</label>
                </div>
                <button type="button" id="load-member-info"
                    class="rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-sm font-medium text-blue-600 transition-colors hover:bg-blue-100">
                    회원 정보 불러오기
                </button>
            </div>
        </form>
    </div>
</section>
