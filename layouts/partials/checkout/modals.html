<!-- Toast Notification -->
<div id="toast"
    class="fixed left-1/2 top-4 z-50 max-w-[calc(100vw-2rem)] -translate-x-1/2 rounded-lg bg-gray-800 px-4 py-2 text-sm text-white opacity-0 shadow-lg transition-opacity duration-300 pointer-events-none">
    메시지
</div>

<!-- Daum Postcode Layer (Modal) -->
<div id="daum-layer" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/50 p-3 sm:items-center sm:p-4">
    <div class="relative h-[min(82vh,560px)] w-full max-w-lg overflow-hidden rounded-2xl bg-white shadow-xl sm:rounded-3xl">
        <button type="button" data-checkout-action="close-postcode" aria-label="주소 검색 닫기"
            class="absolute right-1 top-1 z-10 rounded-full p-2 text-gray-500 transition-colors hover:text-gray-800">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div id="daum-postcode-container" class="w-full h-full"></div>
    </div>
</div>

<!-- Email domain datalist -->
<datalist id="emailDomains">
    <option value="@gmail.com"></option>
    <option value="@naver.com"></option>
    <option value="@daum.net"></option>
    <option value="@outlook.com"></option>
    <option value="@kakao.com"></option>
    <option value="@hanmail.net"></option>
    <option value="@nate.com"></option>
</datalist>
