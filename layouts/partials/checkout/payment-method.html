<section class="checkout-section checkout-section--payment">
    <div class="checkout-section__header">
        <p class="checkout-section__eyebrow">STEP 2</p>
        <h2 class="checkout-section__title">결제 수단</h2>
    </div>
    <div class="checkout-section__body">
        <div id="payment-methods" class="payment-methods" aria-label="결제 수단 선택">
            <!-- Payment methods will be injected here -->
        </div>

        <div id="payment-forms" class="payment-forms">
            <div id="form-inicis" class="payment-form hidden">
                <div class="payment-form__field">
                    <label for="inicis-name" class="payment-form__label">이름</label>
                    <input type="text" id="inicis-name" class="payment-form__input" placeholder="홍길동" autocomplete="name" enterkeyhint="next">
                </div>
                <div class="payment-form__field">
                    <label for="inicis-email" class="payment-form__label">이메일</label>
                    <input type="email" id="inicis-email" class="payment-form__input"
                        placeholder="example@email.com" list="emailDomains" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" enterkeyhint="next">
                    <div id="inicis-email-suggestion" class="payment-form__help" style="display: none;">
                        혹시 <a href="#" class="payment-form__help-link"></a>을(를) 의미하셨나요?
                    </div>
                </div>
                <div class="payment-form__field">
                    <label for="inicis-phone" class="payment-form__label">휴대폰</label>
                    <input type="tel" id="inicis-phone" class="payment-form__input"
                        placeholder="010-1234-5678" autocomplete="tel" inputmode="tel" enterkeyhint="done">
                </div>
            </div>

            <div id="form-korean_payment" class="payment-form hidden">
                <div class="payment-form__field">
                    <label for="korean-name" class="payment-form__label">이름</label>
                    <input type="text" id="korean-name" class="payment-form__input" placeholder="홍길동" autocomplete="name" enterkeyhint="next">
                </div>
                <div class="payment-form__field">
                    <label for="korean-email" class="payment-form__label">이메일</label>
                    <input type="email" id="korean-email" class="payment-form__input"
                        placeholder="example@email.com" list="emailDomains" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" enterkeyhint="next">
                    <div id="korean-email-suggestion" class="payment-form__help" style="display: none;">
                        혹시 <a href="#" class="payment-form__help-link"></a>을(를) 의미하셨나요?
                    </div>
                </div>
                <div class="payment-form__field">
                    <label for="korean-phone" class="payment-form__label">휴대폰</label>
                    <input type="tel" id="korean-phone" class="payment-form__input"
                        placeholder="010-1234-5678" autocomplete="tel" inputmode="tel" enterkeyhint="done">
                </div>
            </div>

            <div id="form-kakaopay" class="payment-form hidden">
                <div class="payment-form__notice">
                    카카오페이로 간편하게 결제하세요.
                </div>
            </div>
        </div>
    </div>
</section>
