<div
  id="cart-overlay"
  data-cart-action="toggle"
  aria-hidden="true"></div>

<div
  id="cart-drawer"
  data-ui-module="cart"
  role="dialog"
  aria-modal="true"
  aria-labelledby="cart-title">
  <header class="cart-header">
    <div class="cart-header__meta">
      <h3 class="cart-title" id="cart-title">🛒 장바구니</h3>
      <span class="cart-count hidden" id="cart-item-count">0</span>
    </div>

    <button
      type="button"
      class="cart-close-btn"
      aria-label="Close cart"
      data-cart-action="toggle">
      ×
    </button>
  </header>

  <div id="cart-items-container" class="cart-body">
    <div class="cart-loading">
      <div class="spinner"></div>
    </div>
  </div>

  {{ partial "cart-template.html" . }}

  <footer class="cart-footer hidden" id="cart-footer">
    <div class="cart-summary">
      <div class="summary-row">
        <span>소계</span>
        <span class="amount" id="cart-subtotal">₩0</span>
      </div>
      <div class="summary-row total">
        <span>총액</span>
        <span class="amount" id="cart-total">₩0</span>
      </div>
    </div>

    <button
      type="button"
      class="cart-checkout-btn"
      id="checkout-btn"
      data-cart-action="checkout">
      💳 주문하기
    </button>
  </footer>
</div>
