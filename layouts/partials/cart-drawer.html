<div
  id="cart-overlay"
  class="fixed inset-0 z-[999] bg-slate-950/50 opacity-0 invisible backdrop-blur-sm transition-[opacity,visibility] duration-300 ease-out"
  data-cart-action="toggle"></div>

<div
  id="cart-drawer"
  class="fixed inset-y-0 right-0 z-[1000] flex h-dvh w-full max-w-[28rem] translate-x-full flex-col overflow-hidden bg-slate-50 text-slate-900 shadow-2xl transition-transform duration-300 ease-out">
  <div class="cart-header flex items-center justify-between gap-3 border-b border-white/10 bg-slate-900 px-4 py-4 text-white sm:px-6">
    <div class="flex min-w-0 items-center gap-2">
      <h3 class="truncate text-lg font-semibold tracking-tight sm:text-xl">🛒 장바구니</h3>
      <span class="cart-count inline-flex min-w-8 items-center justify-center rounded-full bg-white/15 px-2.5 py-1 text-sm font-semibold text-white" id="cart-item-count">0</span>
    </div>
    <button
      type="button"
      class="close-btn inline-flex h-10 w-10 items-center justify-center rounded-full bg-white/10 text-2xl leading-none text-white transition hover:bg-white/20 focus:outline-none focus:ring-4 focus:ring-white/20"
      aria-label="Close cart"
      data-cart-action="toggle">
      ×
    </button>
  </div>

  <div id="cart-items-container" class="flex-1 overflow-y-auto bg-slate-100 p-4 sm:p-5">
    <div class="cart-loading min-h-40">
      <div class="spinner"></div>
    </div>
  </div>

  {{ partial "cart-template.html" . }}

  <div class="cart-footer hidden border-t border-slate-200 bg-white p-4 shadow-[0_-12px_30px_rgba(15,23,42,0.06)] sm:p-5" id="cart-footer">
    <div class="cart-summary space-y-3">
      <div class="summary-row flex items-center justify-between text-sm text-slate-500">
        <span>소계</span>
        <span class="amount font-medium text-slate-900" id="cart-subtotal">₩0</span>
      </div>
      <div class="summary-row total flex items-center justify-between border-t border-slate-200 pt-3 text-lg font-semibold text-slate-900">
        <span>총액</span>
        <span class="amount text-xl font-bold text-slate-900" id="cart-total">₩0</span>
      </div>
    </div>

    <button
      type="button"
      class="checkout-btn mt-4 inline-flex w-full items-center justify-center rounded-full bg-slate-900 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-slate-900/15 transition hover:-translate-y-0.5 hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-slate-900/15 disabled:cursor-not-allowed disabled:opacity-60"
      id="checkout-btn"
      data-cart-action="checkout">
      💳 주문하기
    </button>
  </div>
</div>

<script>
  // Initialize cart on page load
  document.addEventListener('DOMContentLoaded', function () {
    if (window.ShopConfig && window.Cart) {
      Cart.init(window.ShopConfig);
    }
  });
</script>
