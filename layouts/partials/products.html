{{ $data := index .Site.Data .Site.Language.Lang }}

{{ if $data.homepage.products.enable }}
<section class="gallery py-12 sm:py-16" id="products" data-home-products>
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-6 text-center sm:mb-8">
      <h2 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">{{ $data.homepage.products.title | markdownify }}</h2>
    </div>

    <div
      class="product-slider-wrapper relative overflow-hidden rounded-3xl border border-slate-200 bg-white/80 p-3 shadow-sm sm:p-4"
      data-home-products-wrapper>
      <div
        id="product-slider-container"
        class="product-slider flex gap-4 will-change-transform"
        data-home-products-container
        role="list">
        <div class="flex w-full items-center justify-center py-16 text-slate-500" data-home-products-loading>
          <svg class="h-8 w-8 animate-spin text-amber-500" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span class="sr-only">로딩 중...</span>
        </div>
      </div>
    </div>
  </div>

</section>
{{ end }}
