{{ define "main" }}
<section class="flex min-h-[60vh] flex-col items-center justify-center bg-slate-50 px-4 py-24 text-center sm:px-6 lg:px-8">
  <div class="mx-auto max-w-xl">
    <h1 class="text-9xl font-black text-slate-200">404</h1>
    <h2 class="mt-8 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Page not found</h2>
    <p class="mt-4 text-lg leading-relaxed text-slate-600">Sorry, we couldn't find the page you're looking for.</p>
    <div class="mt-10 flex items-center justify-center gap-4">
      <a href="{{ site.Home.RelPermalink }}" class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-100">
        Go back home
      </a>
      <a href="{{ `contact` | relLangURL }}" class="inline-flex items-center justify-center rounded-xl px-6 py-3 text-sm font-semibold text-slate-900 transition hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-slate-100">
        Contact support <span aria-hidden="true">&rarr;</span>
      </a>
    </div>
  </div>
</section>
{{ end }}
