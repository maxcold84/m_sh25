{{ define "main" }}
<style>
    .login-container {
        min-height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at top left, rgba(15, 23, 42, 0.08), transparent 36%),
            radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.08), transparent 28%),
            linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        padding: 1.5rem;
        overflow: hidden;
    }

    .login-container::before,
    .login-container::after {
        content: '';
        position: absolute;
        border-radius: 999px;
        filter: blur(16px);
        pointer-events: none;
    }

    .login-container::before {
        top: -40px;
        left: -40px;
        width: 180px;
        height: 180px;
        background: rgba(15, 23, 42, 0.08);
    }

    .login-container::after {
        right: -60px;
        bottom: -60px;
        width: 220px;
        height: 220px;
        background: rgba(99, 102, 241, 0.08);
    }

    .login-card {
        max-width: 360px;
        width: 100%;
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.88);
        padding: 2rem;
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
        backdrop-filter: blur(10px);
    }

    .login-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.7rem;
        margin-bottom: 1rem;
        border-radius: 999px;
        background: #e2e8f0;
        color: #0f172a;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    .login-title {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #0f172a;
    }

    .login-subtitle {
        margin: 0.45rem 0 1.5rem;
        color: #64748b;
        font-size: 0.94rem;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 1rem;
    }

    .form-label {
        display: block;
        font-size: 0.8125rem;
        color: #374151;
        margin-bottom: 0.375rem;
    }

    .form-input {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font-size: 0.95rem;
        background: #fff;
        color: #0f172a;
        box-sizing: border-box;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }

    .form-input:focus {
        outline: none;
        border-color: #0f172a;
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
    }

    .login-btn {
        width: 100%;
        padding: 0.8rem 1rem;
        margin-top: 0.5rem;
        background: #0f172a;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
    }

    .login-btn:hover:not(:disabled) {
        background: #1e293b;
        transform: translateY(-1px);
    }

    .login-btn:disabled {
        background: #64748b;
        cursor: not-allowed;
        box-shadow: none;
    }

    .error-message {
        background: #fef2f2;
        color: #dc2626;
        padding: 0.625rem 0.75rem;
        border-radius: 12px;
        font-size: 0.8125rem;
        margin-bottom: 1rem;
        display: none;
        border: 1px solid #fecaca;
    }

    .error-message.show {
        display: block;
    }
</style>

{{ partial "admin/nav" . }}
<div class="login-container">
    <div class="login-card">
        <div class="login-badge">Admin access</div>
        <h2 class="login-title">관리자 로그인</h2>
        <p class="login-subtitle">관리자 계정으로 로그인해 주문과 상품을 관리하세요.</p>

        <div id="error-message" class="error-message"></div>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="email-address" class="form-label">이메일</label>
                <input id="email-address" name="email" type="email" autocomplete="email" required class="form-input">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                    class="form-input">
            </div>
            <button type="submit" id="login-btn" class="login-btn">로그인</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const pb = new PocketBase(window.SiteConfig?.pocketbaseUrl || 'http://127.0.0.1:8090');
        const form = document.getElementById('admin-login-form');
        const btn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');

        if (pb.authStore.isValid && pb.authStore.isAdmin) {
            window.location.href = '/ko/admin/orders';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.remove('show');

            const email = document.getElementById('email-address').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = '로그인 중...';

            try {
                await pb.admins.authWithPassword(email, password);
                window.location.href = '/ko/admin/orders';
            } catch (err) {
                console.error(err);
                errorMessage.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
                errorMessage.classList.add('show');
                btn.disabled = false;
                btn.textContent = '로그인';
            }
        });
    });
</script>
{{ end }}
