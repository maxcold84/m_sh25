{{ define "main" }}

<style>
    .admin-toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.75rem;
        margin-bottom: 1rem;
    }

    .admin-toolbar__title {
        margin: 0;
    }

    .admin-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: flex-end;
    }

    .admin-file-picker {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .admin-file-picker__hint {
        color: #6c757d;
        font-size: 0.875rem;
    }

    .admin-image-preview {
        display: none;
        gap: 0.75rem;
        background: #f8f9fa;
    }

    .admin-image-preview img {
        max-height: 200px;
        max-width: 100%;
    }

    .admin-table-wrap {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    .admin-post-thumb {
        width: 50px;
        height: 50px;
        overflow: hidden;
        border-radius: 4px;
        background: #f0f0f0;
    }

    .admin-post-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .admin-post-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        min-width: 220px;
    }

    .admin-post-actions .btn {
        white-space: nowrap;
    }

    @media (max-width: 767.98px) {
        .admin-toolbar {
            align-items: stretch;
        }

        .admin-actions {
            width: 100%;
        }

        .admin-actions .btn {
            width: 100%;
        }

        .admin-post-actions {
            min-width: 0;
        }
    }
</style>

<section class="section">
    <div class="container">
        <div class="row">
            <div class="col-12">
                {{ partial "admin/nav" . }}
                <div class="admin-toolbar">
                    <h2 class="admin-toolbar__title">블로그 관리</h2>
                    <div class="admin-actions">
                        <button id="add-post-btn" class="btn btn-main" type="button">
                            <i class="tf-ion-edit"></i> 글 쓰기
                        </button>
                    </div>
                </div>

                <div class="alert alert-info mb-4">
                    <strong>💡 안내:</strong> 글 작성/수정 후 터미널에서 <code>pnpm sync</code>를 실행하여 블로그에 반영하세요.
                </div>

                <!-- Auth Check -->
                <div id="admin-auth-check" class="alert alert-warning" style="display: none;">
                    관리자로 로그인해야 합니다. <a href="/ko/login">여기서 로그인하세요</a>.
                </div>

                <!-- Post List -->
                <div id="admin-post-list" class="admin-table-wrap">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th style="width: 80px;">이미지</th>
                                <th>제목</th>
                                <th>상태</th>
                                <th>작성일</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody id="post-table-body">
                            <!-- Posts will be loaded here -->
                            <tr class="text-center">
                                <td colspan="5">로딩 중...</td>
                            </tr>
                        </tbody>
                    </table>
                    <div id="loading-spinner" class="text-center py-4">
                        <div class="spinner-border" role="status">
                            <span class="sr-only">로딩 중...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Post Modal -->
<div class="modal fade" id="postModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="postModalLabel">글 쓰기</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="닫기">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="post-form">
                    <input type="hidden" id="post-id">

                    <div class="form-group">
                        <label for="post-title">제목</label>
                        <input type="text" class="form-control" id="post-title" required>
                    </div>

                    <div class="form-group">
                        <label for="post-slug">슬러그 (URL)</label>
                        <input type="text" class="form-control" id="post-slug" required placeholder="자동 생성됨">
                        <small class="form-text text-muted">제목 입력 시 자동 생성됩니다. URL에 사용됩니다.</small>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="post-tags">태그 (쉼표로 구분)</label>
                                <input type="text" class="form-control" id="post-tags" placeholder="예: 일상, 개발, 여행">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="post-categories">카테고리 (쉼표로 구분)</label>
                                <input type="text" class="form-control" id="post-categories"
                                    placeholder="예: News, Tech">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="post-content">내용 (Markdown)</label>
                        <textarea class="form-control font-monospace" id="post-content" rows="12"
                            style="font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; line-height: 1.6; min-height: 240px;"
                            placeholder="# 여기에 마크다운 내용을 작성하세요..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="post-image">대표 이미지</label>
                        <div class="admin-file-picker">
                            <input type="file" class="form-control-file" id="post-image" accept="image/*">
                            <div class="admin-file-picker__hint">선택한 이미지는 글 썸네일로 사용됩니다.</div>
                        </div>
                        <div id="post-image-preview" class="admin-image-preview mt-2 p-2 border rounded text-center">
                            <img src="" alt="Preview">
                            <button type="button" id="clear-post-image-btn" class="btn btn-sm btn-danger d-block mx-auto">
                                이미지 삭제
                            </button>
                        </div>
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="post-published" checked>
                        <label class="form-check-label" for="post-published">공개 (Published)</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                <button type="submit" form="post-form" class="btn btn-main">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/htmx.org@1.9.10"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
<style>
    .EasyMDEContainer {
        z-index: 1000;
    }

    /* Ensure it sits well in modal */
    .editor-toolbar {
        border-radius: 4px 4px 0 0;
    }

    .CodeMirror {
        border-radius: 0 0 4px 4px;
        min-height: 400px;
    }
</style>

{{ $adminPostScript := resources.Get "js/admin-posts.js" }}
<script src="{{ $adminPostScript.Permalink }}"></script>

{{ end }}
