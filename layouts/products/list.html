{{ define "main" }}

<section class="section gallery">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center mb-5">
        <h1 class="font-weight-bold">{{.Title}}</h1>
      </div>

      <div id="product-list-container" class="row w-100">
        <!-- Products will be loaded here -->
        <div class="col-12 text-center">
          <div class="spinner-border" role="status">
            <span class="sr-only">로딩 중...</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener('DOMContentLoaded', async function () {
    const container = document.getElementById('product-list-container');

    try {
      console.log('Loading product list...');
      const result = await productsApi.getList({ perPage: 100, sort: '-order,-created' });

      if (result.items && result.items.length > 0) {
        console.log('Products loaded:', result.items.length);
        container.innerHTML = ''; // Clear loading spinner

        result.items.forEach(product => {
          const imageUrl = (product.images && product.images.length > 0)
            ? productsApi.getImageUrl(product, product.images[0], '300x300')
            : 'https://via.placeholder.com/300x300?text=No+Image';

          const finalPrice = product.discount_price || product.price;

          const col = document.createElement('div');
          col.className = 'col-lg-3 col-md-4 col-sm-6 mb-4';
          col.innerHTML = `
            <div class="block">
              <div class="gallery-overlay">
                <a href="/ko/products/view/?slug=${product.slug}" class="gallery-popup">
                  <i class="tf-ion-plus-round"></i>
                </a>
                <button class="btn btn-primary btn-main-sm"
                  style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 10; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
                  🛒 장바구니 추가
                </button>
              </div>
              <img class="img-fluid" src="${imageUrl}" alt="${product.title}">
            </div>
            <div class="product-info">
              <h4 class="mb-2"><a href="/ko/products/view/?slug=${product.slug}" class="link-title">${product.title}</a></h4>
              <p class="price">
                ${product.discount_price ?
              `{{ site.Params.currency }}${product.discount_price.toLocaleString()} <s class="text-muted">{{ site.Params.currency }}${product.price.toLocaleString()}</s>` :
              `{{ site.Params.currency }}${product.price.toLocaleString()}`
            }
              </p>
            </div>
          `;

          // Add cart functionality
          const cartBtn = col.querySelector('button');
          cartBtn.addEventListener('click', function (e) {
            e.preventDefault();
            Cart.addItem({
              id: product.id,
              name: product.title,
              price: finalPrice,
              image: imageUrl,
              options: {}
            });
          });

          container.appendChild(col);
        });
      } else {
        console.log('No products found');
        container.innerHTML = '<div class="col-12 text-center"><p>등록된 상품이 없습니다.</p></div>';
      }
    } catch (error) {
      console.error('Failed to load products:', error);
      container.innerHTML = '<div class="col-12 text-center"><p class="text-danger">상품을 불러오는 중 오류가 발생했습니다: ' + error.message + '</p></div>';
    }
  });
</script>

{{ end }}
