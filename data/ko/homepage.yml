############################## Testimonial ##########################
testimonial:
  enable: true
  title: "사용자 리뷰"
  testimonial_item:
    # testimonial item loop
    - name: "김철수"
      designation: "CEO, 테마피셔"
      image: "images/avater.png"
      content: "이 시계를 사용하고 나서 제 삶이 완전히 바뀌었습니다. 건강 관리부터 일정 관리까지 모든 것이 완벽합니다."

    # testimonial item loop
    - name: "이영희"
      designation: "디자이너"
      image: "images/avater.png"
      content: "디자인이 너무 예뻐서 매일 차고 다닙니다. 주변 사람들도 어디서 샀냐고 물어볼 정도예요."

    # testimonial item loop
    - name: "박민수"
      designation: "개발자"
      image: "images/avater.png"
      content: "기능이 정말 다양하고 편리합니다. 특히 운동할 때 정말 유용하게 사용하고 있습니다."
