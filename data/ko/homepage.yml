############################# promo ############################
promo:
  enable: true
  image: "images/watch.png"
  title: "전문가가 디자인한, 창의적인 당신을 위한 혜택"
  content:
    "최고의 전문가들이 모여 당신을 위한 완벽한 제품을 만들었습니다.
    <br><br>
    지금 바로 경험해보세요. 당신의 일상이 달라질 것입니다."

############################# About Product #######################
about_product:
  enable: true
  title: "왜 애플 워치를 선택해야 할까요?"
  items:
    # about product item loop
    - image: "images/showcase/showcase-4.png"
      title: "혁신적인 기능"
      content:
        "애플 워치는 단순한 시계가 아닙니다. 당신의 건강을 지켜주고, 일상을 편리하게 만들어주는 최고의 파트너입니다."
      button:
        enable: false
        label: "기능 확인하기"
        link: "#/"

    # about product item loop
    - image: "images/showcase/showcase-3.png"
      title: "아름다운 디자인"
      content:
        "어떤 옷차림에도 완벽하게 어울리는 세련된 디자인을 자랑합니다. 당신의 스타일을 완성해보세요."
      button:
        enable: false
        label: "기능 확인하기"
        link: "#/"

