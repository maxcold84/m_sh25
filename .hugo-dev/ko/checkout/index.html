<script type="module">
    import { hasDaumPostcode, embedDaumPostcode } from '\/js\/core\/daum-postcode.js';
    import { getSuggestedEmail } from '\/js\/core\/email-suggestion.js';
    import { hasPortOne, requestPortOnePayment } from '\/js\/core\/portone-client.js';

    document.addEventListener('DOMContentLoaded', async function () {
        console.log('DOM loaded, checking dependencies...');

        const readConfig = (id) => {
            const scriptEl = document.getElementById(id);
            if (!scriptEl) {
                return {};
            }

            try {
                const rawValue = JSON.parse(scriptEl.textContent || '{}');
                if (rawValue && typeof rawValue === 'object' && !Array.isArray(rawValue)) {
                    return rawValue;
                }

                if (typeof rawValue === 'string') {
                    const nestedValue = JSON.parse(rawValue);
                    if (nestedValue && typeof nestedValue === 'object' && !Array.isArray(nestedValue)) {
                        return nestedValue;
                    }
                }

                return {};
            } catch (error) {
                console.warn(`Failed to parse checkout config: ${id}`, error);
                return {};
            }
        };

        const siteConfig = readConfig('site-config');
        const shopConfig = readConfig('shop-config');

        const layer = document.getElementById('daum-layer');
        const container = document.getElementById('daum-postcode-container');
        const postcodeButtons = document.querySelectorAll('[data-checkout-action="open-postcode"]');
        const closeButtons = document.querySelectorAll('[data-checkout-action="close-postcode"]');
        const backButtons = document.querySelectorAll('[data-checkout-action="history-back"]');
        const postcodeFields = {
            postcode: document.getElementById('postcode'),
            address: document.getElementById('address'),
            detailAddress: document.getElementById('detailAddress'),
            extraAddress: document.getElementById('extraAddress'),
            guide: document.getElementById('guide'),
        };

        const closePostcode = () => {
            if (layer) layer.classList.add('hidden');
        };

        const openPostcode = () => {
            if (!layer || !container || !hasDaumPostcode()) return;

            embedDaumPostcode(container, {
                onComplete(data) {
                    var roadAddr = data.roadAddress;

            if (channel === 'inicis') return 40;
            if (channel === 'kakaopay') return 100;
            if (channel === 'korean_payment') return 256;
            return 100;
        };

        const truncateByUtf8Bytes = (value, maxBytes) => {
            const text = String(value || '');
            const encoder = new TextEncoder();

            if (encoder.encode(text).length <= maxBytes) {
                return text;
            }

            const ellipsis = '...';
            const ellipsisBytes = encoder.encode(ellipsis).length;
            let result = '';

            for (const char of text) {
                const nextValue = result + char;
                if (encoder.encode(nextValue).length > maxBytes - ellipsisBytes) {
                    break;
                }
                result = nextValue;
            }

            return result ? `${result}${ellipsis}` : ellipsis;
        };

        const buildOrderName = (items, channel) => {
            if (!Array.isArray(items) || items.length === 0) {
                return '상품';

            const baseName = items.length > 1

                : firstItemName;

            return truncateByUtf8Bytes(baseName, getOrderNameByteLimit(channel));

        async function getCurrentUserRecord(options = {}) {
            const { refresh = false } = options;
            const authUser = pb.authStore.model;

            if (!pb.authStore.isValid || !authUser?.id) {
                currentUser = null;
                return null;
            }

            if (!refresh) {
                currentUser = authUser;
                return authUser;
            }

            try {
                const freshUser = await pb.collection('users').getOne(authUser.id, withNoAutoCancel());
                pb.authStore.save(pb.authStore.token, {
                    ...authUser,
                    ...freshUser
                });
                currentUser = pb.authStore.model;
                return currentUser;
            } catch (error) {
                console.warn('Failed to refresh current user record, falling back to auth store:', error);
                currentUser = authUser;
                return authUser;
            }
        }

                const isSelected = radio && radio.value === selectedValue;
                card.classList.toggle('is-selected', isSelected);
                card.setAttribute('aria-checked', isSelected ? 'true' : 'false');

        function setupEmailAutocomplete(emailInputId, suggestionDivId) {
            const emailInput = document.getElementById(emailInputId);
            const suggestionDiv = document.getElementById(suggestionDivId);

            if (!emailInput || !suggestionDiv) return;

            let suggestionLink = suggestionDiv.querySelector('a');

            emailInput.addEventListener('blur', function () {
                const email = emailInput.value.trim();
                if (!email) {
                    suggestionDiv.style.display = 'none';
                    return;
                }

                const suggestion = getSuggestedEmail(email, ['gmail.com', 'naver.com', 'daum.net', 'kakao.com', 'outlook.com', 'hanmail.net', 'nate.com']);
                const nextLink = suggestionLink.cloneNode(true);
                suggestionLink.replaceWith(nextLink);
                suggestionLink = nextLink;

                if (!suggestion) {
                    suggestionDiv.style.display = 'none';
                    return;
                }

                nextLink.textContent = suggestion;
                nextLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    emailInput.value = suggestion;
                    suggestionDiv.style.display = 'none';
                });
                suggestionDiv.style.display = 'block';
            });
        }

        function renderCart() {
            if (cartItems.length === 0) {
                cartContainer.innerHTML = '<div class="checkout-empty-state"><p>장바구니가 비어있습니다.</p><span>상품을 담으면 이곳에서 확인할 수 있어요.</span></div>';
                totalAmount = 0;
                updateTotal();
                return;
            }

            let html = '';
            let total = 0;

            cartItems.forEach(item => {
                
                const product = item.expand?.product_id;

                
                const productName = product ? product.name : item.name;
                const productPrice = product ? product.price : item.price;
                const productImages = product ? product.images : null;

                if (!productName) {
                    console.warn('Product info missing for item:', item);
                    return;
                }

                const price = productPrice || 0;
                const qty = item.quantity || 1;
                const subtotal = price * qty;
                total += subtotal;

                const imageFilename = productImages && productImages.length > 0 ? productImages[0] : null;
                let imageUrl;

                
                if (item.image) {
                    imageUrl = item.image;
                } else if (imageFilename && product) {
                    imageUrl = pb.files.getUrl(product, imageFilename, { thumb: '80x80' });
                } else {
                    imageUrl = 'https://via.placeholder.com/80';

                const productSlug = item._productSlug;
                const productLink = productSlug ? `/ko/products/${productSlug}/` : null;

                html += `
                <article class="checkout-summary-item">
                    ${productLink
                        ? `<a href="${productLink}" class="checkout-summary-item__media-link"><img src="${imageUrl}" alt="${productName}" class="checkout-summary-item__image" loading="lazy" decoding="async"></a>`
                        : `<div class="checkout-summary-item__media"><img src="${imageUrl}" alt="${productName}" class="checkout-summary-item__image" loading="lazy" decoding="async"></div>`
                    }
                    <div class="checkout-summary-item__content">
                        <h3 class="checkout-summary-item__title">${productLink
                        ? `<a href="${productLink}" class="checkout-summary-item__link">${productName}</a>`
                        : productName
                    }</h3>
                        <p class="checkout-summary-item__meta">수량 ${qty}개</p>
                        <p class="checkout-summary-item__subtotal">${formatPrice(subtotal)}</p>
                    </div>
                </article>`;
            });

            cartContainer.innerHTML = html;
            totalAmount = total;
            updateTotal();
        }

        payBtn.addEventListener('click', async () => {
            const formData = new FormData(shippingForm);
            const shippingInfo = {
                receiver: formData.get('receiver'),
                phone: formData.get('phone'),
                postcode: formData.get('postcode'),
                address: formData.get('address'),
                detailAddress: formData.get('detailAddress'),
                extraAddress: formData.get('extraAddress'),
                deliveryNote: formData.get('deliveryNote'),
            };

            if (!shippingInfo.receiver || !shippingInfo.phone || !shippingInfo.postcode || !shippingInfo.address) {
                showToast('배송지 정보를 모두 입력해주세요.', true);
                scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            if (cartItems.length === 0) {
                showToast('주문할 상품이 없습니다.', true);
                return;
            }

            const paymentMethodEl = document.querySelector('input[name="payment-method"]:checked');
            if (!paymentMethodEl) {
                showToast('결제 수단을 선택해주세요.', true);
                return;
            }

            const selectedChannel = paymentMethodEl.value;
            const customerData = {};
            const customerFields = getCustomerFields();
            const name = customerFields.name?.value.trim() || '';
            const email = customerFields.email?.value.trim() || '';
            const phone = customerFields.phone?.value.trim() || '';

            if (!name) return showToast('결제자 이름을 입력해주세요.', true);
            if (!email) return showToast('결제자 이메일을 입력해주세요.', true);
            if (!phone) return showToast('결제자 휴대폰 번호를 입력해주세요.', true);

            customerData.fullName = name;
            customerData.email = email;
            customerData.phoneNumber = phone;



            
            try {
                for (const item of cartItems) {
                    const productId = item.product_id || (item.expand?.product_id?.id);
                    
                    
                    

                    if (!productId) continue;

                    const product = await pb.collection('products').getOne(productId);
                    const currentStock = parseInt(product.stock) || 0;
                    const qty = parseInt(item.quantity) || 1;
                    const productName = product.title || product.name || '상품';

                    if (currentStock < qty) {
                        alert(`[${productName}]\n재고가 부족하여 주문할 수 없습니다.\n(현재 재고: ${currentStock}개)\n\n담당자에게 문의해주세요.`);
                        return; 
                    }
                }
            } catch (err) {
                console.error('Stock validation failed:', err);
                alert('상품 재고 정보를 확인할 수 없습니다. 다시 시도해주세요.');
                return;
            }

            payBtn.disabled = true;
            payBtn.textContent = '처리중...';

            try {
                const paymentId = `ord${crypto.randomUUID().replace(/-/g, '').substring(0, 29)}`;
                const channelKey = shopConfig.channels[selectedChannel];

                let payMethod = "CARD";
                if (selectedChannel === 'kakaopay') payMethod = "EASY_PAY";

                const orderName = buildOrderName(cartItems, selectedChannel);

                const requestData = {
                    storeId: shopConfig.storeId,
                    channelKey: channelKey,
                    paymentId: paymentId,
                    orderName: orderName,
                    totalAmount: totalAmount,
                    currency: "KRW",
                    payMethod: payMethod,
                    customer: customerData,
                    redirectUrl: location.origin + '/payment/complete',
                };

                const response = await requestPortOnePayment(requestData);

                if (response.code != null) {
                    throw new Error(response.message);
                }

                const orderData = {
                    payment_id: paymentId,
                    total_amount: totalAmount,
                    status: 'paid',
                    items: cartItems.map(item => ({
                        product_id: item.product_id,
                        qty: item.quantity,
                        price: item.expand?.product_id?.price || item.price,
                        name: item.expand?.product_id?.name || item.name || '상품',
                        image: item.image || (item.expand?.product_id?.images ? item.expand.product_id.images[0] : '')
                    })),
                    buyer_details: {
                        ...response,
                        shipping_info: shippingInfo,
                        customer: customerData 
                    }
                };

                if (currentUser) {
                    orderData.user = currentUser.id;
                    
                }

                await pb.collection('orders').create(orderData);

                
                console.log('Updating inventory...');
                for (const item of cartItems) {
                    try {
                        
                        const productId = item.product_id || (item.expand?.product_id?.id);
                        if (!productId) continue;

                        const product = await pb.collection('products').getOne(productId);

                        
                        const currentStock = parseInt(product.stock) || 0;
                        const qty = parseInt(item.quantity) || 1;
                        const newStock = Math.max(0, currentStock - qty); 

                        
                        await pb.collection('products').update(productId, {
                            stock: newStock
                        });
                        console.log(`Updated stock for ${product.name}: ${currentStock} -> ${newStock}`);

                    } catch (err) {
                        console.error('Failed to update stock for item:', item, err);
                        
                    }
                }

                for (const item of cartItems) {
                    await pb.collection('cart_items').delete(item.id);
                }

                alert('결제가 완료되었습니다!');
                location.href = '/';

            } catch (err) {
                console.error('Payment failed:', err);
                showToast(`결제 실패: ${err.message}`, true);
                payBtn.disabled = false;
                payBtn.textContent = '결제하기';
            }

        if (kakaopayQuickPayBtn) {
            kakaopayQuickPayBtn.addEventListener('click', () => {
                if (payBtn.disabled) {
                    showToast('주문 정보를 먼저 확인해주세요.', true);
                    return;
                }

                payBtn.click();
            });
        }

        console.log('Initializing checkout page...');
        initPaymentMethods();
        loadCart();
        await autofillShippingAddress();

        
        setupEmailAutocomplete('payment-customer-email', 'payment-customer-email-suggestion');
    });
</script>
